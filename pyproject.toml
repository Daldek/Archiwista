[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archiwista"
version = "0.1.0"
description = "Local browser for spatial data stores"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Piotr de Bever", email = "git@debever.pl" }]
dependencies = [
    "kartograf>=0.8.0,<0.9",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2,<3",
    "platformdirs>=4,<5",
    # 2.1: shapely.transform(..., interleaved=False) for pinned operations.
    "shapely>=2.1,<3",
    "pyproj>=3.6,<4",
    # Version comparison of producer plugins; packaging versions are year-based.
    "packaging>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "httpx>=0.27,<1",
    "playwright>=1.50,<2",
]

[project.scripts]
archiwista = "archiwista.cli:main"

# Producer adapters (plugins): factories load(context) -> SourceAdapter.
[project.entry-points."archiwista.sources"]
kartograf = "archiwista.adapter.kartograf:load"

[tool.setuptools.packages.find]
include = ["archiwista*"]

[tool.setuptools.package-data]
"archiwista.web" = ["**/*"]
# Local Swagger UI of /api/docs (swagger-ui-dist 5.33.3, Apache-2.0).
"archiwista.api" = ["swagger/*"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["docs", "mockup"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
files = ["archiwista", "tests"]
strict = true

[[tool.mypy.overrides]]
# Kartograf ships no type information (no py.typed marker).
module = ["kartograf", "kartograf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Shapely ships no type information (no py.typed marker).
module = ["shapely", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -m 'not live and not perf and not smb' --cov=archiwista --cov-fail-under=80"
markers = [
    "live: requires real network services or data",
    "perf: requires the explicit large synthetic store",
    "smb: requires a real mounted SMB share",
]

[tool.coverage.run]
source = ["archiwista"]
# Job workers run as subprocesses (``python -m archiwista.jobs.worker``).
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 80
