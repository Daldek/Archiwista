[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archiwista"
version = "0.3.0.dev0"
description = "Local browser for spatial data stores"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Piotr de Bever", email = "git@debever.pl" }]
dependencies = [
    # Commit of the Kartograf branch `develop` (REL-5.3): the read API of the
    # store (KA-1 to KA-6) has no release yet. The release pull request
    # replaces the commit with the tag (REL-2.1). The versions the adapter
    # reads are `SUPPORTED_VERSIONS` in `archiwista.adapter.kartograf`.
    "kartograf @ git+https://github.com/Daldek/Kartograf@8e9bcbb058d11f06afae5a65e62f31870f69d169",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2,<3",
    "platformdirs>=4,<5",
    # 2.1: shapely.transform(..., interleaved=False) for pinned operations.
    "shapely>=2.1,<3",
    "pyproj>=3.6,<4",
    # Version comparison of producer plugins; packaging versions are year-based.
    "packaging>=24",
    # Area files (GeoJSON, GeoPackage, Shapefile) read with GDAL in a worker.
    "pyogrio>=0.10,<1",
    # Previews, only in render and build processes (plan v0.2, decision 3):
    # rio-tiler (with rasterio, morecantile, numexpr, color-operations)
    # colours and encodes images. Below 9.1, which requires httpx2: with it
    # installed, Starlette's TestClient (and its types) switch to httpx2.
    "rio-tiler>=9.0,<9.1",
    # Point clouds: LAZ headers, CRS from VLRs and chunked reads (lazrs).
    "laspy[lazrs]>=2.7,<3",
]

[project.optional-dependencies]
# The IMGW-PIB and ČHMÚ source (plan 2026-10-25, I1): archives, series and station
# catalogs of an IMGWTools store. The commit is the head of the IMGWTools branch
# `feature/data-output` (REL-5.3); the release pull request replaces it with the tag
# `v3.0.0`. `[store]` brings `pyarrow` for the Parquet series. The versions the
# adapter reads are `SUPPORTED_VERSIONS` in `archiwista.adapter.imgw`.
imgw = [
    "imgwtools[store] @ git+https://github.com/Daldek/IMGWTools@a30452182b01f47cc18e48466da4edf4d0c8cb6a",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "httpx>=0.27,<1",
    "playwright>=1.50,<2",
    # Validates the error documents against the Nogat schemas (schemas/nogat).
    "jsonschema>=4.18,<5",
]

[project.scripts]
archiwista = "archiwista.cli:main"

# Producer adapters (plugins): factories load(context) -> SourceAdapter. The `imgw`
# adapter reports `not_installed` until the extra `imgw` is installed.
[project.entry-points."archiwista.sources"]
kartograf = "archiwista.adapter.kartograf:load"
imgw = "archiwista.adapter.imgw:load"

[tool.setuptools.packages.find]
where = ["src"]
include = ["archiwista*"]

[tool.setuptools.package-data]
"archiwista.web" = ["**/*"]
# Local Swagger UI of /api/docs (swagger-ui-dist 5.33.3, Apache-2.0).
"archiwista.api" = ["swagger/*"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["docs", "mockup"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "D"]
ignore = ["D203", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
# Shapely ships no type information (no py.typed marker).
module = ["shapely", "shapely.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyogrio ships no type information (no py.typed marker).
module = ["pyogrio", "pyogrio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# rasterio, laspy and lazrs ship no type information (no py.typed marker).
module = ["rasterio", "rasterio.*", "laspy", "laspy.*", "lazrs", "lazrs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# jsonschema (contract tests) ships neither a py.typed marker nor bundled stubs.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# imgwtools (the `imgw` extra) ships no py.typed marker.
module = ["imgwtools", "imgwtools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -m 'not live and not perf and not smb'"
markers = [
    "live: requires real network services or data",
    "db: needs a database server (none in this project: SQLite is embedded)",
    "slow: takes more than about 10 s or needs Docker (none marked yet)",
    "perf: requires the explicit large synthetic store",
    "smb: requires a real mounted SMB share",
]
# A leaked file or connection fails the test that leaked it (no silencing).
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["archiwista"]
# Job workers run as subprocesses (``python -m archiwista.jobs.worker``).
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 80
