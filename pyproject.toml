[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archiwista"
version = "0.3.0.dev0"
description = "Local web application for browsing the spatial-data stores that Kartograf writes: catalog, map, file previews, projects with snapshots. Web interface, HTTP API and CLI; never writes to a store."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Piotr de Bever", email = "git@debever.pl" }]
dependencies = [
    # Commit of the Kartograf branch `feature/data-output` (REL-5.3): the store
    # root `root`, the marker `kartograf-store.json`, the default root
    # (`store_root()`), `kartograf.testing` (ADR-054), `find_sheet_outlines`
    # (PL-2000 zones of powiats, Kartograf ADR-055), the refresh TTL of the
    # metadata cache with the index answers shared by the availability report and
    # the plans (Kartograf ADR-056), `store_state()`, `PROJECT_LOCK` with the
    # reason `project_locked` and the task options of `run_command("project add")`
    # (Archiwista's requests) have no release yet; the commit is on GitHub.
    # The release pull request replaces the commit with the tag (REL-2.1) and
    # narrows `SUPPORTED_VERSIONS` to `>=0.8.0` (REL-5.6). The versions the
    # adapter reads are `SUPPORTED_VERSIONS` in `archiwista.adapter.kartograf`.
    "kartograf @ git+https://github.com/Daldek/Kartograf@745e8b18b586243ae4899fa483db74588cc13dac",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2,<3",
    "platformdirs>=4,<5",
    # 2.1: shapely.transform(..., interleaved=False) for pinned operations.
    "shapely>=2.1,<3",
    "pyproj>=3.6,<4",
    # Version comparison of producer plugins; packaging versions are year-based.
    "packaging>=24",
    # Area files (GeoJSON, GeoPackage, Shapefile) read with GDAL in a worker.
    "pyogrio>=0.10,<1",
    # Previews, only in render and build processes (plan v0.2, decision 3):
    # rio-tiler (with rasterio, morecantile, numexpr, color-operations)
    # colours and encodes images. Below 9.1, which requires httpx2: with it
    # installed, Starlette's TestClient (and its types) switch to httpx2.
    "rio-tiler>=9.0,<9.1",
    # The previews transform with `@` (`Affine @ Affine`, `Affine @ (x, y)`), which
    # affine 3 brought; rasterio also admits affine 2, where `@` raises TypeError
    # and every preview is unreadable.
    "affine>=3,<4",
    # Point clouds: LAZ headers, CRS from VLRs and chunked reads (lazrs).
    "laspy[lazrs]>=2.7,<3",
]

[project.optional-dependencies]
# The IMGW-PIB and ČHMÚ source (plan 2026-10-25, I1): archives, series and station
# catalogs of an IMGWTools store. The commit is the head of the IMGWTools branch
# `feature/data-output` (REL-5.3), which has the default root (`store_root()`); the
# release pull request replaces it with the tag `v3.0.0`. `[store]` brings `pyarrow` for the Parquet series. The versions the
# adapter reads are `SUPPORTED_VERSIONS` in `archiwista.adapter.imgw`.
imgw = [
    "imgwtools[store] @ git+https://github.com/Daldek/IMGWTools@6bd35a49b329f99b591ffdee39367daec0e75af7",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "httpx>=0.27,<1",
    "playwright>=1.50,<2",
    # Validates the error documents against the Nogat schemas (schemas/nogat).
    "jsonschema>=4.18,<5",
    # A test certificate authority for team mode over TLS (tests/fixtures/team_server.py).
    "trustme>=1.2,<2",
]

[project.scripts]
archiwista = "archiwista.cli:main"

# Producer adapters (plugins): factories load(context) -> SourceAdapter. The `imgw`
# adapter reports `not_installed` until the extra `imgw` is installed.
[project.entry-points."archiwista.sources"]
kartograf = "archiwista.adapter.kartograf:load"
imgw = "archiwista.adapter.imgw:load"

[tool.setuptools.packages.find]
where = ["src"]
include = ["archiwista*"]

[tool.setuptools.package-data]
"archiwista.web" = ["**/*"]
# Local Swagger UI of /api/docs (swagger-ui-dist 5.33.3, Apache-2.0).
"archiwista.api" = ["swagger/*"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["docs", "mockup"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "D"]
ignore = ["D203", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
# Shapely ships no type information (no py.typed marker).
module = ["shapely", "shapely.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyogrio ships no type information (no py.typed marker).
module = ["pyogrio", "pyogrio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# rasterio, laspy and lazrs ship no type information (no py.typed marker).
module = ["rasterio", "rasterio.*", "laspy", "laspy.*", "lazrs", "lazrs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# jsonschema (contract tests) ships neither a py.typed marker nor bundled stubs.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -m 'not live and not perf and not smb'"
# A test that runs longer than this (seconds) writes the stacks of all threads
# into the log, so a hang shows where it hangs (the run goes on).
faulthandler_timeout = 600
markers = [
    "live: requires real network services or data",
    "db: needs a database server (none in this project: SQLite is embedded)",
    "slow: takes more than about 10 s or needs Docker (none marked yet)",
    "perf: requires the explicit large synthetic store",
    "smb: requires a real mounted SMB share",
]
# A leaked file or connection fails the test that leaked it (no silencing).
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["archiwista"]
# Job workers run as subprocesses (``python -m archiwista.jobs.worker``).
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 80
